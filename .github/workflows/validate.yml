name: validate

on:
  push:
  pull_request:

jobs:
  posterloom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python posterloom/scripts/validate_repo.py posterloom
      - name: Run routing regressions
        run: python posterloom/evals/run_evals.py
      - name: Compile and lint example prompt
        run: |
          python posterloom/scripts/compose_prompt.py posterloom/examples/scene-night-teahouse.json --output prompt.txt --route-output route.json
          python posterloom/scripts/validate_prompt.py prompt.txt
